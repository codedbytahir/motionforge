name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix packages/motionforge --ignore-scripts
      - run: npm ci --prefix packages/create-motionforge --ignore-scripts
      - run: npm run typecheck --prefix packages/motionforge
      - run: npm run build --prefix packages/motionforge
      - run: npm test --prefix packages/motionforge
      - run: npm run test:package --prefix packages/motionforge
      - run: npm test --prefix packages/create-motionforge
      - run: node audit/final/test-review.mjs
      - run: npm run build
      - name: Dependency scan
        run: |
          npm audit --omit=dev
          npm audit --prefix packages/motionforge
          npm audit --prefix packages/create-motionforge
