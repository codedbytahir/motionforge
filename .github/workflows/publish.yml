name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      confirm_publication_with_known_findings:
        description: 'Authorize publication with the unresolved findings disclosed in audit/final/REVIEW.md'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: inputs.confirm_publication_with_known_findings
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix packages/motionforge --ignore-scripts
      - run: npm ci --prefix packages/create-motionforge --ignore-scripts
      - name: Verify library and CLI
        run: |
          npm run typecheck --prefix packages/motionforge
          npm run build --prefix packages/motionforge
          npm test --prefix packages/motionforge
          npm run test:package --prefix packages/motionforge
          npm test --prefix packages/create-motionforge
          node audit/final/test-review.mjs
      - name: Publish exact versions (existing npm secret or configured OIDC)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/motionforge packages/create-motionforge; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Fail closed on network/auth errors; only E404 means unpublished.
            if npm view "$name@$version" version --json > /tmp/npm-version.json 2>/tmp/npm-version.err; then
              echo "$name@$version already exists; skipping"
            elif grep -q E404 /tmp/npm-version.err; then
              (cd "$dir" && npm publish --access public --provenance)
            else
              cat /tmp/npm-version.err
              exit 1
            fi
          done
